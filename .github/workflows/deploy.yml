# 정적 빌드 → Cloudflare Pages
#
# main에 들어오면 운영에, PR이면 미리보기 주소에 배포한다.
# 근거: docs/adr/0016-static-build.md
#
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 포크에서 온 PR에는 시크릿이 없다 — 배포를 시도하지 않는다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      # 전체 이력이 필요하다 — 아래 단계가 파일마다 마지막 커밋 시각을 찾는다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 체크아웃 직후에는 모든 파일의 수정시각이 "지금"이다. 그대로 빌드하면
      # 자산의 ?v=, 미디어 경로의 시각, 사이트맵의 lastmod가 배포할 때마다 전부 바뀐다.
      # 파일마다 마지막 커밋 시각으로 되돌려 "내용이 바뀌어야 주소가 바뀐다"를 지킨다.
      # git-restore-mtime 패키지는 쓰지 않는다 — 안에서 부르는 `git whatchanged`를 git 2.51부터
      # 거부하는데, 도구는 경고만 찍고 성공으로 끝나 아무것도 되돌리지 않은 채 빌드가 이어졌다.
      # 이 루프는 시각을 못 찾으면 touch가 실패해 단계가 멈춘다.
      - name: Restore file mtimes from git history
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, mbstring, intl, dom, curl
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      # 굽는 썸네일 캐시. 본문 이미지마다 크기 계단을 WebP로 굽느라(ADR-0018) 빈 media/에서
      # 빌드하면 로컬에서도 1분이 걸리고, 이미 구운 것이 있으면 1초가 안 걸린다.
      # 썸네일 경로는 원본의 해시·수정시각·옵션으로 정해지므로(소금 고정, 수정시각 복원)
      # 지난번 것을 그대로 써도 틀린 파일이 나갈 수 없다. 쓰이지 않는 옛 썸네일이 남아도
      # 빌드는 HTML이 가리키는 것만 dist/로 옮긴다.
      - uses: actions/cache@v4
        with:
          path: media
          key: media-${{ hashFiles('content/**', 'site/snippets/image.php') }}
          restore-keys: media-

      - run: php scripts/build-static.php

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GitHub Deployment를 만들어 PR 화면에 미리보기 주소를 띄운다 (permissions의 deployments: write)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=massivevoid --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

# 정적 빌드 → Cloudflare Pages
#
# main에 들어오면 운영에, PR이면 미리보기 주소에 배포한다.
# 근거: docs/adr/0016-static-build.md
#
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 포크에서 온 PR에는 시크릿이 없다 — 배포를 시도하지 않는다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      # 전체 이력이 필요하다 — 아래 단계가 파일마다 마지막 커밋 시각을 찾는다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 체크아웃 직후에는 모든 파일의 수정시각이 "지금"이다. 그대로 빌드하면
      # 자산의 ?v=, 미디어 경로의 시각, 사이트맵의 lastmod가 배포할 때마다 전부 바뀐다.
      # 파일마다 마지막 커밋 시각으로 되돌려 "내용이 바뀌어야 주소가 바뀐다"를 지킨다.
      - name: Restore file mtimes from git history
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git-restore-mtime
          git restore-mtime

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, mbstring, intl, dom, curl
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - run: php scripts/build-static.php

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GitHub Deployment를 만들어 PR 화면에 미리보기 주소를 띄운다 (permissions의 deployments: write)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=massivevoid --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
